<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VISTA | Gallery</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- LOADING SCREEN -->

    <div class="loader" id="loader">

        <div class="loader-ring"></div>

        <h3>VISTA</h3>

        <p>
            Preparing gallery...
        </p>

    </div>


    <!-- GLOW -->

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            VISTA<span>.</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="gallery.html" class="active">
                Gallery
            </a>

        </nav>

        <button
            id="themeBtn"
            class="theme-btn"
        >
            ☀
        </button>

    </header>


    <!-- GALLERY HEADER -->

    <section class="gallery-page">

        <div class="gallery-heading">

            <div>

                <span class="eyebrow">
                    COLLECTION
                </span>

                <h1>
                    Visual <span>Stories.</span>
                </h1>

                <p>
                    Every page reveals a different collection.
                </p>

            </div>


            <div class="search-box">

                <span>⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search images..."
                >

            </div>

        </div>


        <!-- FILTER -->

        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="nature"
            >
                Nature
            </button>

            <button
                class="filter-btn"
                data-filter="travel"
            >
                Travel
            </button>

            <button
                class="filter-btn"
                data-filter="city"
            >
                City
            </button>

            <button
                class="filter-btn"
                data-filter="wildlife"
            >
                Wildlife
            </button>

        </div>


        <!-- GALLERY -->

        <div
            class="gallery-grid"
            id="galleryGrid"
        ></div>


        <!-- NO RESULT -->

        <div
            class="no-result"
            id="noResult"
        >

            <div>⌕</div>

            <h3>
                No images found
            </h3>

            <p>
                Try another category or search word.
            </p>

        </div>


        <!-- PAGINATION -->

        <div class="pagination">

            <button
                id="prevPage"
                class="page-btn"
            >
                ← Previous
            </button>


            <div class="page-number">

                <span id="currentPage">
                    1
                </span>

                <small>
                    /
                </small>

                <span id="totalPages">
                    3
                </span>

            </div>


            <button
                id="nextPage"
                class="page-btn primary-page-btn"
            >
                Next Page →
            </button>

        </div>


        <div class="page-info">

            <span id="pageInfo">
                PAGE 01
            </span>

            <p>
                More stories waiting for you...
            </p>

        </div>

    </section>


    <!-- LIGHTBOX -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <button
            class="close-btn"
            id="closeBtn"
        >
            ×
        </button>


        <button
            class="light-arrow left"
            id="prevPhoto"
        >
            ‹
        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt=""
            >

            <div class="lightbox-info">

                <div>

                    <small id="lightboxCategory">
                        NATURE
                    </small>

                    <h2 id="lightboxTitle">
                        Image
                    </h2>

                </div>


                <div
                    class="light-counter"
                    id="lightCounter"
                >
                    01 / 10
                </div>

            </div>

        </div>


        <button
            class="light-arrow right"
            id="nextPhoto"
        >
            ›
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
